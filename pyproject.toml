[project]
name = "agent-can"
version = "0.2.0"
description = "Agent-first CAN control MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Tom Ford" }]
keywords = ["can", "mcp", "dbc", "gocan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.scripts]
agent-can = "agent_can:main"

[project.urls]
Homepage = "https://github.com/tomrford/agent-can"
Repository = "https://github.com/tomrford/agent-can"
Issues = "https://github.com/tomrford/agent-can/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_can"]
exclude = ["/src/agent_can/bin"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/cmd", "/internal", "/examples", "/go.mod", "/go.sum", "/hatch_build.py", "/tests"]
exclude = ["/src/agent_can/bin"]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.14.0"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
